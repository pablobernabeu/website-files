{{- define "main" -}}

{{ partial "page_header.html" . }}

<div class="universal-wrapper software-archive">
  <div class="row">
    <div class="col-lg-12">
      {{ with .Content }}
      <div class="article-style">{{ . }}</div>
      {{ end }}

      <div id="container-software">
        {{ range .Pages.ByDate.Reverse }}
        <div class="software-item">
          {{ partial "li_compact" . }}
        </div>
        {{ end }}
      </div>
    </div>
  </div>
</div>

{{- end -}}
