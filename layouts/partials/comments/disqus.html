{{ if site.Params.comments.disqus.shortname }}
<div id="disqus_thread">
  <p class="text-muted">
    Comments are provided by Disqus and are not loaded automatically. Loading them connects your browser to Disqus, which may use cookies and process data under its
    <a href="https://help.disqus.com/en/articles/1717103-disqus-privacy-policy">privacy policy</a>.
    See this site's <a href="{{ "privacy/" | relURL }}">privacy notice</a> for details.
  </p>
  <button type="button" id="load-disqus-comments" class="btn btn-outline-primary">Load comments from Disqus</button>
  <p id="disqus-status" class="small text-muted mt-2" role="status" aria-live="polite"></p>
  <noscript>JavaScript is required to load Disqus comments.</noscript>
</div>
<script>
  (function () {
    var button = document.getElementById('load-disqus-comments');
    var status = document.getElementById('disqus-status');

    if (!button) {
      return;
    }

    button.addEventListener('click', function () {
      button.disabled = true;
      status.textContent = 'Loading comments from Disqus…';

      window.disqus_config = function () {
        {{ with .Params.disqus_identifier }}this.page.identifier = {{ . | jsonify | safeJS }};{{ end }}
        {{ with .Params.disqus_Title }}this.page.title = {{ . | markdownify | plainify | jsonify | safeJS }};{{ end }}
        {{ with .Params.disqus_url }}this.page.url = {{ . | jsonify | safeJS }};{{ end }}
      };

      var script = document.createElement('script');
      script.src = 'https://{{ site.Params.comments.disqus.shortname }}.disqus.com/embed.js';
      script.async = true;
      script.setAttribute('data-timestamp', String(+new Date()));
      script.addEventListener('error', function () {
        button.disabled = false;
        button.textContent = 'Try loading comments again';
        status.textContent = 'Disqus could not be loaded.';
      });
      (document.head || document.body).appendChild(script);
    });
  })();
</script>
{{ end }}
