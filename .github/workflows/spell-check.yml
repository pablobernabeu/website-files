name: Spell Check

on:
  push:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
  pull_request:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
  workflow_dispatch: # Allow manual triggering

jobs:
  spell-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check spelling
        uses: crate-ci/typos@master
        with:
          config: .typos.toml
