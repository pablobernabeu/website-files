name: Spell Check

on:
  push:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
  pull_request:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
  workflow_dispatch: # Allow manual triggering

# Reads the checked-out tree and reports through the job log only.
permissions:
  contents: read

jobs:
  spell-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          config: .typos.toml
          files: content/
