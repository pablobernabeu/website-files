name: Software image copies

# Every image under content/software/<pkg>/images/ is a hand-made copy of a
# figure knitted by one of the posts, and carries that figure's knitr chunk
# name. Nothing keeps the two in step: re-knitting a post rewrites its own
# figure and leaves the copy behind. That is how the pilotr and scopusflow
# pages came to show plots whose captions were still drawn inside the image
# months after the posts had moved those notes underneath them.
#
# A copy whose name matches a post figure must therefore be byte-identical to
# it. An image with no matching post figure is a genuinely separate asset and
# is left alone, so renaming one is the way to opt out of this check.

on:
  pull_request:
    paths:
      - "content/software/**/images/**"
      - "content/post/**/figure-html/**"
  push:
    branches: [master]
    paths:
      - "content/software/**/images/**"
      - "content/post/**/figure-html/**"
  workflow_dispatch:

# Reads the checked-out tree and reports through job annotations only.
permissions:
  contents: read

jobs:
  software-image-copies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare each copy with the post figure it was taken from
        run: |
          set -euo pipefail
          checked=0
          stale=0
          while IFS= read -r -d '' copy; do
            name="$(basename "$copy")"
            mapfile -t origins < <(find content/post -type f -path '*/figure-html/*' -name "$name")
            if [ "${#origins[@]}" -eq 0 ]; then
              echo "::debug::$copy has no post figure of the same name; treated as its own asset"
              continue
            fi
            if [ "${#origins[@]}" -gt 1 ]; then
              pkg="$(basename "$(dirname "$(dirname "$copy")")")"
              narrowed=()
              for o in "${origins[@]}"; do
                case "$o" in content/post/*"$pkg"*) narrowed+=("$o") ;; esac
              done
              if [ "${#narrowed[@]}" -eq 1 ]; then
                origins=("${narrowed[0]}")
              else
                echo "::warning file=$copy::$name occurs in ${#origins[@]} posts and none is clearly $pkg's; skipping the comparison"
                continue
              fi
            fi
            checked=$((checked + 1))
            if ! cmp -s "$copy" "${origins[0]}"; then
              echo "::error file=$copy::$copy differs from ${origins[0]}, which it is a copy of. Re-copy it, or rename it if it is meant to be a different figure."
              stale=$((stale + 1))
            fi
          done < <(find content/software -type f -path '*/images/*' -print0)
          echo "Compared $checked copies against their post figures; $stale out of step."
          [ "$stale" -eq 0 ]
