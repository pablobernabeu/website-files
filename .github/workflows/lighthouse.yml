name: Lighthouse

# Weekly performance / accessibility / best-practices / SEO audit of the live
# site. Assertions are soft (warnings) so normal fluctuation never fails the
# job, and the uploaded report link in the logs is the signal to watch.
#
# Besides the home page and the post list, the URLs cover the three article
# pages that carry the most weight: the emissions post for its interactive map
# and scatterplot, the depictr post for its figure count, and the language post
# for its photograph. A regression in page weight shows up on those first.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Checks out the tree for lighthouserc.json; the report is uploaded to
# Lighthouse CI's temporary public storage, not through the GitHub API.
permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://pablobernabeu.github.io/
            https://pablobernabeu.github.io/post/
            https://pablobernabeu.github.io/2026/greenhouse-gas-emissions-in-context/
            https://pablobernabeu.github.io/2026/depictr-one-visual-language-from-first-look-to-final-figure/
            https://pablobernabeu.github.io/2026/how-language-shapes-our-perception-of-time-and-magnitude/
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
