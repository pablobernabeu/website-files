name: Lighthouse

# Weekly performance / accessibility / best-practices / SEO audit of the live
# site. Assertions are soft (warnings) so normal fluctuation never fails the
# job; the uploaded report link in the logs is the signal to watch.

on:
  schedule:
    # Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://pablobernabeu.github.io/
            https://pablobernabeu.github.io/post/
          configPath: ./.github/lighthouse/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
