name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "assets/**"
      - "content/**"
      - "static/**"
      - "themes/**"
      - "layouts/**"
      - "config/**"
      - "config.toml"
  workflow_dispatch: # Allow manual triggering

# The deploy pushes to a separate repository with DEPLOY_TOKEN, so the workflow
# token itself never needs write access here.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit graph is needed to date Rmd sources against their HTML
          # output; blobs are filtered out because only the commit graph is read.
          fetch-depth: 0
          filter: "blob:none"
          persist-credentials: false

      - name: Set up Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.62.0/hugo_extended_0.62.0_Linux-64bit.tar.gz
          tar -xzf hugo_extended_0.62.0_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Check for stale Rmd → HTML pages
        id: stale-rmd
        run: |
          stale_file="${RUNNER_TEMP}/stale-rmd-files.txt"
          : > "$stale_file"

          while IFS= read -r -d '' rmd; do
            html="${rmd%.Rmd}.html"
            reason=""

            if [ ! -f "$html" ]; then
              reason="HTML output is missing"
            else
              html_commit="$(git log -1 --format=%H -- "$html")"
              rmd_commit="$(git log -1 --format=%H -- "$rmd")"
              if [ -z "$html_commit" ] || [ -z "$rmd_commit" ]; then
                reason="Rmd or HTML output has no Git history"
              elif ! git merge-base --is-ancestor "$rmd_commit" "$html_commit"; then
                reason="Rmd was last changed after its HTML output"
              fi
            fi

            if [ -n "$reason" ]; then
              printf '%s\n' "$rmd" >> "$stale_file"
              printf 'Stale: %s (%s)\n' "$rmd" "$reason"
            fi
          done < <(find content -type f -name '*.Rmd' -print0)

          stale_count="$(wc -l < "$stale_file")"
          echo "count=$stale_count" >> "$GITHUB_OUTPUT"
          if [ "$stale_count" -gt 0 ]; then
            echo "has_stale=true" >> "$GITHUB_OUTPUT"
            echo "Found $stale_count stale Rmd file(s)."
          else
            echo "has_stale=false" >> "$GITHUB_OUTPUT"
            echo "All HTML pages are up to date."
          fi

      - name: Set up R
        if: steps.stale-rmd.outputs.has_stale == 'true'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "release"

      - name: Install system dependencies
        if: steps.stale-rmd.outputs.has_stale == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        if: steps.stale-rmd.outputs.has_stale == 'true'
        run: |
          install.packages(c("blogdown"), repos = "https://cloud.r-project.org")
          blogdown::install_hugo("0.62.0")
        shell: Rscript {0}

      - name: Rebuild stale Rmd posts
        if: steps.stale-rmd.outputs.has_stale == 'true'
        run: |
          stale_file <- file.path(Sys.getenv("RUNNER_TEMP"), "stale-rmd-files.txt")
          stale_files <- readLines(stale_file, warn = FALSE)
          stopifnot(length(stale_files) > 0)

          # A post that cannot be knitted here must not stop the deploy: some
          # sources need packages or credentials the runner has no reason to hold
          # (e.g. a Scopus API key). Publishing the previously committed HTML is a
          # better outcome than taking the whole site offline, so failures are
          # reported and the build continues.
          failed <- character(0)
          for (rmd in stale_files) {
            cat("Rebuilding:", rmd, "\n")
            tryCatch(
              blogdown::build_site(build_rmd = rmd),
              error = function(e) {
                failed <<- c(failed, rmd)
                cat("::warning file=", rmd, "::Could not rebuild: ",
                    conditionMessage(e), "\n", sep = "")
              }
            )
          }

          summary_path <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary_path)) {
            lines <- if (length(failed) == 0) {
              sprintf("Rebuilt %d stale Rmd post(s).", length(stale_files))
            } else {
              c(sprintf("Rebuilt %d of %d stale Rmd post(s). Still stale:",
                        length(stale_files) - length(failed), length(stale_files)),
                paste0("- `", failed, "`"))
            }
            cat(lines, file = summary_path, sep = "\n", append = TRUE)
          }
        shell: Rscript {0}
        env:
          RSTUDIO_PANDOC: /usr/bin

      - name: Build site
        run: hugo --minify

      - name: Remove generated and secret files from published output
        run: |
          pruned_count="$(find public -type f \
            \( -name 'DOIs, ????-??-?? ????.csv' \
               -o -name 'additional DOIs, ????-??-?? ????.csv' \
               -o -name 'date and time of previous retrieval of DOIs.txt' \
               -o -iname 'scopus*key*.txt' \) \
            -print -delete | wc -l)"
          echo "Removed $pruned_count generated or secret file(s)."
          # A published API key would be a disclosure, not just bloat, so fail loudly
          # if one survived Hugo's ignoreFiles and reached the build output.
          if find public -type f -iname 'scopus*key*.txt' | grep -q .; then
            echo "::error::An API key file is still present in ./public" >&2
            exit 1
          fi

      - name: Deploy to pablobernabeu.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: pablobernabeu/pablobernabeu.github.io
          publish_branch: master
          publish_dir: ./public
          # Deliberately not the source commit message: that is attacker-influenced
          # text flowing into another repository's history.
          commit_message: "Deploy from ${{ github.sha }}"
