name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    paths:
      - "content/**"
      - "static/**"
      - "themes/**"
      - "layouts/**"
      - "config/**"
      - "config.toml"
  workflow_dispatch: # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Hugo
        run: |
          wget -q https://github.com/gohugoio/hugo/releases/download/v0.62.0/hugo_extended_0.62.0_Linux-64bit.tar.gz
          tar -xzf hugo_extended_0.62.0_Linux-64bit.tar.gz
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Check for stale Rmd → HTML pages
        id: stale-rmd
        run: |
          stale=""
          while IFS= read -r rmd; do
            html="${rmd%.Rmd}.html"
            if [ -f "$html" ]; then
              # Rebuild if Rmd is newer than its HTML counterpart
              if [ "$rmd" -nt "$html" ]; then
                stale="$stale $rmd"
              fi
            else
              # No HTML yet — needs building
              stale="$stale $rmd"
            fi
          done < <(find content -name '*.Rmd' -type f)
          stale="$(echo "$stale" | xargs)"
          if [ -n "$stale" ]; then
            echo "Stale Rmd files found:"
            echo "$stale" | tr ' ' '\n'
            echo "stale=$stale" >> "$GITHUB_OUTPUT"
          else
            echo "All HTML pages are up to date"
            echo "stale=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up R
        if: steps.stale-rmd.outputs.stale != ''
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install system dependencies
        if: steps.stale-rmd.outputs.stale != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        if: steps.stale-rmd.outputs.stale != ''
        run: |
          install.packages(c("blogdown"), repos = "https://cloud.r-project.org")
          blogdown::install_hugo("0.62.0")
        shell: Rscript {0}

      - name: Rebuild stale Rmd posts
        if: steps.stale-rmd.outputs.stale != ''
        run: |
          stale_files <- strsplit("${{ steps.stale-rmd.outputs.stale }}", "\\s+")[[1]]
          stale_files <- stale_files[nzchar(stale_files)]
          for (rmd in stale_files) {
            cat("Rebuilding:", rmd, "\n")
            blogdown::build_site(build_rmd = rmd)
          }
        shell: Rscript {0}
        env:
          RSTUDIO_PANDOC: /usr/bin

      - name: Build site
        run: hugo --minify

      - name: Deploy to pablobernabeu.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: pablobernabeu/pablobernabeu.github.io
          publish_branch: master
          publish_dir: ./public
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
