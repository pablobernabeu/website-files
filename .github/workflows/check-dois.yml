name: Check DOI Resolution

on:
  schedule:
    # Run on the 1st and 15th of each month at 04:00 UTC
    - cron: "0 4 1,15 * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  check-dois:
    runs-on: ubuntu-latest
    # Hard cap: the checks below run in parallel and finish in ~1-2 min. This
    # ceiling exists only so a pathological hang can never again burn the full
    # 6-hour job limit and get silently cancelled (which produced no report and
    # no issue for months).
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Extract and verify DOIs
        id: check
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # SCOPE: only DOIs the site actually authors -- publication front
          # matter, hand-written citations, badges, and reference lists in
          # posts. We deliberately do NOT check the auto-collected
          # `related-references.html` files or the `related references/*.csv`
          # logs: those hold ~20k third-party DOIs pulled from external
          # metadata, many of which are legitimately paywalled, rate-limited
          # or simply dead upstream. Validating them produced unactionable
          # noise and, once the collection grew, made this job run for 6h and
          # get cancelled. Restricting to *.md / *.Rmd cuts that to ~200 DOIs
          # the author can actually fix.
          # ---------------------------------------------------------------

          # 1. Collect unique "DOI<TAB>file" pairs (first file wins per DOI).
          declare -A SEEN
          : > dois.tsv
          while IFS= read -r line; do
            file=${line%%:*}
            rest=${line#*:}
            # Extract a DOI, excluding <>{}[]"' so HTML tags and BibTeX braces
            # are not captured.
            doi=$(printf '%s' "$rest" | grep -oP '10\.\d{4,9}/[^\s>"'\''<{}\[\]]+' | head -1 || true)
            [ -z "$doi" ] && continue
            # Normalise the captured DOI so publisher URL cruft is not mistaken
            # for a broken DOI: drop a query/fragment (`?...`, `&type=large`,
            # `#...`), common landing-page path suffixes (`/full`, `/abstract`,
            # a Zenodo badge's `.svg`, etc.), any trailing slash, and trailing
            # punctuation from surrounding prose.
            doi=$(printf '%s' "$doi" | sed -E '
              s/[?&#].*$//;
              s#/(full|abstract|meta|pdf|epdf|summary|html)$##;
              s#/+$##;
              s/\.(svg|png|jpe?g|gif)$//;
              s/[)>,;.:}]+$//')
            [ -z "$doi" ] && continue
            if [ -z "${SEEN[$doi]:-}" ]; then
              SEEN[$doi]=1
              printf '%s\t%s\n' "$doi" "$file" >> dois.tsv
            fi
          done < <(grep -rn 'doi:\|doi\.org/' content/ --include="*.md" --include="*.Rmd")

          TOTAL=$(wc -l < dois.tsv | tr -d ' ')
          echo "Collected $TOTAL unique DOIs to check."

          # 2. Resolve each DOI. A DOI counts as reachable when doi.org
          #    redirects to a landing page (2xx/3xx) or the publisher answers
          #    with an access/anti-bot gate (401 paywall, 403 forbidden,
          #    429 rate-limited, 418 teapot). Any other definite HTTP answer,
          #    a 404 or 410 above all, is a failure.
          #
          #    A connection that never completes is neither, and no longer counts
          #    as one. curl reports 000 for a DNS failure, a TLS error, a refused
          #    connection and a timeout alike, none of which say anything about
          #    whether the DOI is registered: they describe the runner's network
          #    and the publisher's uptime at that moment. Counting one as broken
          #    is what put 10.5334/joc.10 -- Brysbaert & Stevens (2018), which
          #    resolves in about a second -- under an issue titled "Broken DOIs
          #    detected" and left it open. Unreached DOIs are now tallied apart
          #    and raise no issue on their own, but they still appear in the
          #    report, so one that is never reachable does not go unseen.
          check_doi() {
            local doi="$1" code
            local ua="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -L \
                --max-time 30 --connect-timeout 15 \
                -H "User-Agent: $ua" \
                "https://doi.org/$doi" 2>/dev/null) || code="000"
              case "$code" in
                2??|3??|401|403|429|418) printf 'OK\t%s\t%s\n' "$code" "$doi"; return 0 ;;
                000) if [ "$attempt" -lt 3 ]; then sleep $(( attempt * 5 )); continue; fi
                     printf 'UNREACHED\ttimeout\t%s\n' "$doi"; return 0 ;;
                *)   printf 'FAIL\t%s\t%s\n' "$code" "$doi"; return 0 ;;
              esac
            done
          }
          export -f check_doi

          # Run up to 12 checks concurrently; ~200 DOIs finish in well under a
          # minute instead of the old sequential ~1s/DOI + retries.
          cut -f1 dois.tsv | xargs -r -P 12 -I{} bash -c 'check_doi "$@"' _ {} > results.tsv || true

          # 3. Build the report.
          echo "## DOI Resolution Report" > doi-report.md
          echo "" >> doi-report.md
          echo "Checked: $(date -u +'%Y-%m-%d %H:%M UTC')" >> doi-report.md
          echo "" >> doi-report.md
          echo "Scope: DOIs authored in \`content/**/*.md\` and \`*.Rmd\` (publication front matter, citations, badges, reference lists). Auto-collected related-reference DOIs are excluded." >> doi-report.md
          echo "" >> doi-report.md

          FAILED=$(grep -c '^FAIL' results.tsv || true)
          FAILED=${FAILED:-0}
          UNREACHED=$(grep -c '^UNREACHED' results.tsv || true)
          UNREACHED=${UNREACHED:-0}

          echo "### Summary" >> doi-report.md
          echo "" >> doi-report.md
          echo "- **Total unique DOIs checked:** $TOTAL" >> doi-report.md
          echo "- **Broken (the registry or publisher gave a definite failure):** $FAILED" >> doi-report.md
          echo "- **Not reached (no answer after three tries; not evidence of a broken DOI):** $UNREACHED" >> doi-report.md
          echo "" >> doi-report.md

          if [ "$FAILED" -gt 0 ]; then
            echo "### Broken DOIs" >> doi-report.md
            echo "" >> doi-report.md
            echo "| DOI | HTTP Status | File |" >> doi-report.md
            echo "|-----|------------|------|" >> doi-report.md
            while IFS=$'\t' read -r _ status doi; do
              file=$(grep -m1 -P "^\Q$doi\E\t" dois.tsv | cut -f2 || true)
              printf '| `%s` | %s | %s |\n' "$doi" "$status" "$file" >> doi-report.md
            done < <(grep '^FAIL' results.tsv)
            echo "" >> doi-report.md
          fi

          if [ "$UNREACHED" -gt 0 ]; then
            echo "### Not reached" >> doi-report.md
            echo "" >> doi-report.md
            echo "These did not answer within the timeout on any of three tries. That usually means the publisher was slow or briefly down, or the runner's network was; it is not evidence that the DOI is broken. Worth a look only if the same DOI keeps appearing here run after run." >> doi-report.md
            echo "" >> doi-report.md
            echo "| DOI | File |" >> doi-report.md
            echo "|-----|------|" >> doi-report.md
            while IFS=$'\t' read -r _ _ doi; do
              file=$(grep -m1 -P "^\Q$doi\E\t" dois.tsv | cut -f2 || true)
              printf '| `%s` | %s |\n' "$doi" "$file" >> doi-report.md
            done < <(grep '^UNREACHED' results.tsv)
            echo "" >> doi-report.md
          fi

          if [ "$FAILED" -gt 0 ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            if [ "$UNREACHED" -eq 0 ]; then
              echo "All DOIs resolved successfully." >> doi-report.md
            fi
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

          echo "=== DOI Check Complete: $TOTAL checked, $FAILED broken, $UNREACHED not reached ==="
          cat doi-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: doi-resolution-report
          path: doi-report.md
          retention-days: 30

      - name: Create issue if DOIs are broken
        if: steps.check.outputs.has_failures == 'true'
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5
        with:
          title: "Broken DOIs detected"
          content-filepath: doi-report.md
          labels: maintenance, automated
