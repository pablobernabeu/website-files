name: Check DOI Resolution

on:
  schedule:
    # Run on the 1st and 15th of each month at 04:00 UTC
    - cron: "0 4 1,15 * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  check-dois:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract and verify DOIs
        id: check
        run: |
          echo "## DOI Resolution Report" > doi-report.md
          echo "" >> doi-report.md
          echo "Checked: $(date -u +'%Y-%m-%d %H:%M UTC')" >> doi-report.md
          echo "" >> doi-report.md

          TOTAL=0
          FAILED=0
          FAILED_DETAILS=""
          SEEN=""

          # Extract DOIs from frontmatter (doi: field) and content (<https://doi.org/...>)
          while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            # Exclude <, {, }, [, ] to avoid capturing HTML tags and BibTeX braces
            doi=$(echo "$line" | grep -oP '10\.\d{4,9}/[^\s>"'\''<{}\[\]]+' | head -1)

            if [ -z "$doi" ]; then
              continue
            fi

            # Remove trailing HTML fragments (e.g., </p, </a) and punctuation
            doi=$(echo "$doi" | sed -E 's/<\/[a-zA-Z].*$//; s/[)>,;.:}]+$//')

            if [ -z "$doi" ]; then
              continue
            fi

            # Skip duplicates within this run
            if echo "$SEEN" | grep -qF "$doi"; then
              continue
            fi
            SEEN="$SEEN $doi"

            TOTAL=$((TOTAL + 1))

            # Resolve the DOI with a HEAD request
            # NOTE: || must be OUTSIDE $() to avoid concatenating status codes (e.g., "302000")
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -L \
              --max-time 60 --retry 2 --retry-delay 5 \
              -H "User-Agent: DOI-Checker/1.0 (https://pablobernabeu.github.io; academic site link checker)" \
              "https://doi.org/$doi" 2>/dev/null) || HTTP_CODE="000"

            # Accept: 2xx/3xx (OK/redirect), 401/403 (paywalled), 418 (server quirk)
            if [[ "$HTTP_CODE" =~ ^[23][0-9][0-9]$ ]] || [ "$HTTP_CODE" = "401" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "418" ]; then
              : # OK
            elif [ "$HTTP_CODE" = "000" ]; then
              FAILED=$((FAILED + 1))
              FAILED_DETAILS="$FAILED_DETAILS\n| \`$doi\` | **timeout** | $file |"
              echo "TIMEOUT: $doi (in $file)"
            else
              FAILED=$((FAILED + 1))
              FAILED_DETAILS="$FAILED_DETAILS\n| \`$doi\` | $HTTP_CODE | $file |"
              echo "FAIL [$HTTP_CODE]: $doi (in $file)"
            fi

            # Rate limit: be polite to DOI resolvers
            sleep 1

          done < <(grep -rn 'doi:\|doi\.org/' content/publication/ --include="*.md" --include="*.Rmd" --include="*.html")

          echo "### Summary" >> doi-report.md
          echo "" >> doi-report.md
          echo "- **Total unique DOIs checked:** $TOTAL" >> doi-report.md
          echo "- **Failed to resolve:** $FAILED" >> doi-report.md
          echo "" >> doi-report.md

          if [ "$FAILED" -gt 0 ]; then
            echo "### Failed DOIs" >> doi-report.md
            echo "" >> doi-report.md
            echo "| DOI | HTTP Status | File |" >> doi-report.md
            echo "|-----|------------|------|" >> doi-report.md
            echo -e "$FAILED_DETAILS" >> doi-report.md
            echo "" >> doi-report.md
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
          else
            echo "All DOIs resolved successfully." >> doi-report.md
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

          echo ""
          echo "=== DOI Check Complete: $TOTAL checked, $FAILED failed ==="
          cat doi-report.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: doi-resolution-report
          path: doi-report.md
          retention-days: 30

      - name: Create issue if DOIs are broken
        if: steps.check.outputs.has_failures == 'true'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken DOIs detected"
          content-filepath: doi-report.md
          labels: maintenance, automated
