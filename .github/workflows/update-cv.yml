name: Update CV from OSF

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allow manual triggering

# Commits the refreshed CV back to master, so this one needs write access.
permissions:
  contents: write

jobs:
  update-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download CV from OSF
        run: |
          # --fail so that an HTTP error is an error. Without it curl writes the
          # error body to the output file and still exits 0, which counts here
          # as a successful download.
          downloaded=no
          for i in {1..3}; do
            echo "Download attempt $i..."
            if curl -L --fail --max-time 300 --retry 3 --retry-delay 10 -o temp-cv.pdf https://osf.io/download/84ktq; then
              downloaded=yes
              break
            fi
            echo "Download attempt $i failed, retrying..."
            sleep 30
          done

          # The flag, not the file. curl creates the output file whether or not
          # the transfer succeeds, so a test for its existence could never fail
          # and the branch below was unreachable.
          if [ "$downloaded" != "yes" ]; then
            echo "Failed to download CV from OSF after 3 attempts"
            exit 1
          fi

          # Check file size (should be reasonable for a CV)
          file_size=$(stat -f%z temp-cv.pdf 2>/dev/null || stat -c%s temp-cv.pdf)
          if [ "$file_size" -lt 1000 ]; then
            echo "Downloaded file is too small (${file_size} bytes), likely an error page"
            exit 1
          fi

          # Check if it's a valid PDF
          if ! file temp-cv.pdf | grep -q "PDF"; then
            echo "Downloaded file is not a valid PDF"
            cat temp-cv.pdf | head -5
            exit 1
          fi

          # ...and a complete one. Neither check above catches a partial
          # download: a CV cut off part-way through is still megabytes long, and
          # `file` reads only the intact header, so it reports a valid PDF of
          # however many pages arrived. A transfer that dropped mid-stream would
          # be committed and published as the CV. Every PDF ends with a %%EOF
          # trailer and a truncated one does not.
          if ! tail -c 2048 temp-cv.pdf | grep -qa '%%EOF'; then
            echo "Downloaded PDF has no %%EOF trailer (${file_size} bytes): the transfer was truncated"
            exit 1
          fi

          echo "Successfully downloaded valid PDF (${file_size} bytes)"

          # Copy the CV to the static/ source directory only. Hugo copies static/
          # into the built site on deploy, so a public/ copy is redundant now that
          # public/ is no longer tracked in this repo.
          #
          # The commit below is authored by GITHUB_TOKEN, and GitHub raises no
          # push event for those, so it does not start a deploy of its own. The
          # refreshed CV is published by the next deploy from any source; that
          # build checks out master, so it picks this commit up regardless of
          # what triggered it. The collection workflow runs twice a day, which
          # bounds the wait at about twelve hours.
          echo "Copying CV to static/ directory..."
          cp temp-cv.pdf static/cv-pablo-bernabeu.pdf

      - name: Check for changes
        id: changes
        run: |
          # Check the static/ source for changes
          if git diff --quiet static/cv-pablo-bernabeu.pdf; then
            echo "No changes detected in CV"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "CV has been updated"
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add static/cv-pablo-bernabeu.pdf
          git commit -m "Automated CV update from OSF"
          # The reference collector commits to master too and runs for hours, so
          # master can move between this job's checkout and its push. Rebase the
          # single CV commit on whatever landed rather than failing the run.
          git pull --rebase origin master
          git push
