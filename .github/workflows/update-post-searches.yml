name: Update post searches

# Re-runs the bibliographic searches behind two posts (see
# scripts/update_post_searches.R), commits the results to the branch the run was
# dispatched from and also publishes them as an artifact, so that the posts can
# be rebuilt from fresh counts without holding the Scopus key locally.
# Dispatch-only: nothing here runs on a schedule or on push.
#
# The commit is pushed with GITHUB_TOKEN, and GitHub starts no workflow run for
# a push made with that token. The deploy workflow therefore does not run, and
# nothing in CI re-knits the posts either, since Hugo reads the committed
# index.en.html files. After a run, pull the new tables, re-knit the two posts
# locally and commit the .Rmd and .html files, whose push then deploys them.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Which searches to run
        type: choice
        default: all
        options:
          - all
          - speculation
          - allfit

# The job commits the search results back to the dispatching branch.
permissions:
  contents: write

# Two runs on one branch would both write the same files and race to push. A
# second run waits for the first, which is never cancelled, as that would
# discard Scopus quota already spent.
concurrency:
  group: update-post-searches-${{ github.ref }}
  cancel-in-progress: false

jobs:
  search:
    # A named image, so that the system libraries and the Posit Package Manager
    # binaries below (built for Ubuntu 24.04) do not move with ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      # A dated snapshot of CRAN, so that a rerun installs the same package
      # versions. It holds scopusflow 0.4.0, the version the posts cite.
      PPM_SNAPSHOT: https://packagemanager.posit.co/cran/__linux__/noble/2026-09-22

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so that the commit step can rebase on the branch.
          fetch-depth: 0

      - name: Set up R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2.13.0
        with:
          r-version: "4.6.1"
          use-public-rspm: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        # The package manager serves Linux binaries only to a client that names
        # its R version and platform in the user agent, and source packages
        # otherwise, which would compile every dependency.
        run: |
          options(HTTPUserAgent = sprintf(
            "R/%s R (%s)", getRversion(),
            paste(getRversion(), R.version$platform, R.version$arch, R.version$os)
          ))
          repos <- c(PPM = Sys.getenv("PPM_SNAPSHOT"))
          install.packages(c("httr2", "jsonlite", "scopusflow"), repos = repos)
          if (packageVersion("scopusflow") != "0.4.0")
            stop("Expected scopusflow 0.4.0 but installed ", packageVersion("scopusflow"))
          sessionInfo()
        shell: Rscript {0}

      - name: Run searches
        run: Rscript scripts/update_post_searches.R "$TARGET"
        env:
          TARGET: ${{ inputs.target || 'all' }}
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}

      - name: Commit results
        # Also after a failure, so that the searches that did complete are kept.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/post/*/searches/
          if git diff --cached --quiet; then
            echo "No search results to commit."
            exit 0
          fi
          git commit -m "Update post searches"
          # master receives bot commits daily, and a run takes long enough for
          # the branch to move under it. Rebase the commit on whatever landed
          # before pushing, and try again if the branch moves once more.
          for attempt in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} was rejected; retrying."
            sleep 15
          done
          echo "Could not push the search results; they remain in the artifact."
          exit 1

      - name: Upload results
        # Also after a failure, so that the searches that did complete are kept.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: post-searches
          path: content/post/*/searches/
          if-no-files-found: warn
          retention-days: 30
