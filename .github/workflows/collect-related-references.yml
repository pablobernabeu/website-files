name: Collect Related References

on:
  schedule:
    # Run twice daily at 03:00 and 15:00 UTC
    - cron: "0 3,15 * * *"
  workflow_dispatch: # Allow manual triggering

jobs:
  # -----------------------------------------------------------------------
  # 1. Discover publications & run one-time PDF query generation
  # -----------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publications: ${{ steps.list.outputs.publications }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdfplumber
        run: pip install pdfplumber

      - name: Auto-generate query scripts from PDFs
        run: python scripts/extract_refs_from_pdfs.py

      - name: Upload generated queries
        uses: actions/upload-artifact@v4
        with:
          name: generated-queries
          path: content/publication/**/related references/
          if-no-files-found: ignore

      - name: List publications
        id: list
        run: |
          pubs=$(ls -d content/publication/*/ 2>/dev/null \
            | xargs -I{} basename {} \
            | grep -v '^[_.]' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "publications=$pubs" >> $GITHUB_OUTPUT
          echo "Found publications: $pubs"

  # -----------------------------------------------------------------------
  # 2. Collect references — one parallel job per publication
  # -----------------------------------------------------------------------
  collect:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      matrix:
        publication: ${{ fromJSON(needs.discover.outputs.publications) }}
      fail-fast: false
      max-parallel: 2

    env:
      SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download generated queries
        uses: actions/download-artifact@v4
        with:
          name: generated-queries
          path: content/publication/
        continue-on-error: true

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: actions/cache@v4
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-packages-${{ hashFiles('scripts/collect_related_references.R') }}
          restore-keys: r-packages-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages(c("yaml", "rscopus", "rcrossref", "dplyr", "httr", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Collect references for ${{ matrix.publication }}
        run: |
          Rscript scripts/collect_related_references.R --pub "${{ matrix.publication }}"

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- "content/publication/${{ matrix.publication }}"; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --name-only -- "content/publication/${{ matrix.publication }}"
          fi

      - name: Upload changed files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: changes-${{ matrix.publication }}
          path: content/publication/${{ matrix.publication }}/

  # -----------------------------------------------------------------------
  # 3. Commit — merge all changes and open a PR
  # -----------------------------------------------------------------------
  commit:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download all change artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: changes-*
          path: _artifacts/
        continue-on-error: true

      - name: Apply changes
        run: |
          shopt -s nullglob
          any=false
          if [ -d _artifacts ]; then
            for dir in _artifacts/changes-*/; do
              pub=$(basename "$dir" | sed 's/^changes-//')
              echo "Applying changes for: $pub"
              cp -r "$dir"* "content/publication/$pub/"
              any=true
            done
            rm -rf _artifacts/
          fi
          if [ "$any" = false ]; then
            echo "No artifacts to apply"
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Set date
        id: date
        run: echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Delete existing PR branch if present
        if: steps.changes.outputs.changed == 'true'
        run: |
          git push origin --delete "automated/related-references-${{ steps.date.outputs.today }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create pull request with new references
        if: steps.changes.outputs.changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated related references update ${{ steps.date.outputs.today }}"
          branch: automated/related-references-${{ steps.date.outputs.today }}
          delete-branch: true
          title: "New related references ${{ steps.date.outputs.today }}"
          body: |
            Automated collection of related references from Scopus & CrossRef.
          labels: automated, references

      - name: Auto-merge pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash \
            --subject "Automated related references update ${{ steps.date.outputs.today }}" \
            --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
