name: Collect Related References

on:
  schedule:
    # Run twice daily at 03:00 and 15:00 UTC
    - cron: "0 3,15 * * *"
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

concurrency:
  group: collect-related-references-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # 1. Discover bundles & run one-time PDF query generation
  # -----------------------------------------------------------------------
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      bundles: ${{ steps.list.outputs.bundles }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pdfplumber
        run: pip install pdfplumber

      - name: Auto-generate query scripts from PDFs
        run: python scripts/extract_refs_from_pdfs.py

      - name: Upload generated queries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-queries
          path: content/publication/**/related references/
          if-no-files-found: ignore

      - name: List bundles
        id: list
        # Every publication is listed. A software page is listed only once it
        # has a related-references.html or a related references folder, as in
        # list_bundle_dirs() in the collector, so that a new package or app
        # page is not given generated queries. Each entry keeps its section
        # because the same folder name can exist in both, and every later step
        # has to write back to the right one.
        run: |
          bundles=$(
            {
              # Names are filtered in jq because grep exits 1 when no line
              # survives. With pipefail, which an explicit `shell: bash` turns
              # on, that would fail the step whenever no software page
              # qualifies.
              ls -d content/publication/*/ 2>/dev/null \
                | xargs -I{} basename {} \
                | jq -R -c 'select(test("^[_.]") | not) | {section: "publication", name: .}'
              for dir in content/software/*/; do
                if [ -f "${dir}related-references.html" ] \
                  || [ -d "${dir}related references" ] \
                  || [ -d "${dir}related-references" ]; then
                  basename "$dir"
                fi
              done \
                | jq -R -c 'select(test("^[_.]") | not) | {section: "software", name: .}'
            } | jq -s -c '.'
          )
          echo "bundles=$bundles" >> $GITHUB_OUTPUT
          echo "Found bundles: $bundles"

  # -----------------------------------------------------------------------
  # 2. Collect references: one parallel job per bundle
  # -----------------------------------------------------------------------
  collect:
    name: collect (${{ matrix.bundle.section }}/${{ matrix.bundle.name }})
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      matrix:
        bundle: ${{ fromJSON(needs.discover.outputs.bundles) }}
      fail-fast: false
      max-parallel: 2
    env:
      # SECTION/NAME, the form the collector's --pub resolves without
      # ambiguity, and the bundle's path below content/.
      BUNDLE: ${{ matrix.bundle.section }}/${{ matrix.bundle.name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The PDF query generator only reads publications, so this destination
      # is the same whichever section the job's bundle is in.
      - name: Download generated queries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: generated-queries
          path: content/publication/
        continue-on-error: true

      - name: Set up R
        id: setup-r
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "release"

      - name: Cache R packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.R_LIBS_USER }}
          key: r-${{ steps.setup-r.outputs.installed-r-version }}-packages-${{ hashFiles('scripts/collect_related_references.R') }}
          restore-keys: r-${{ steps.setup-r.outputs.installed-r-version }}-packages-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages(c("yaml", "rscopus", "rcrossref", "dplyr", "httr", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Collect references for ${{ matrix.bundle.section }}/${{ matrix.bundle.name }}
        run: |
          Rscript scripts/collect_related_references.R --pub "$BUNDLE"
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}

      # Checked with git status because git diff ignores untracked files. A
      # bundle's first collection creates related-references.html and
      # pending-dois.json, and a check blind to new files would discard them
      # on every run.
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- "content/$BUNDLE")" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git status --porcelain --untracked-files=all -- "content/$BUNDLE"
          fi

      # Artifact names cannot contain "/", so the section is joined to the
      # folder name with a hyphen. The commit job splits it at the first one,
      # which is safe because no section name contains a hyphen.
      - name: Upload changed files
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: changes-${{ matrix.bundle.section }}-${{ matrix.bundle.name }}
          path: content/${{ env.BUNDLE }}/

  # -----------------------------------------------------------------------
  # 3. Commit — merge all changes and open a PR
  # -----------------------------------------------------------------------
  commit:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all change artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: changes-*
          path: _artifacts/
        continue-on-error: true

      - name: Apply changes
        run: |
          shopt -s nullglob
          any=false
          if [ -d _artifacts ]; then
            for dir in _artifacts/changes-*/; do
              # changes-SECTION-NAME, named by the collect job's upload step.
              id=$(basename "$dir" | sed 's/^changes-//')
              section=${id%%-*}
              name=${id#*-}
              target="content/$section/$name"
              # Checked here because cp does not always fail on a missing
              # target: given a single folder it creates the target, and a
              # misread name would then publish a stray page.
              if [ ! -d "$target" ]; then
                echo "::error::Artifact $(basename "$dir") does not match an existing bundle: $target"
                exit 1
              fi
              echo "Applying changes for: $section/$name"
              cp -r "$dir"* "$target/"
              any=true
            done
            rm -rf _artifacts/
          fi
          if [ "$any" = false ]; then
            echo "No artifacts to apply"
          fi

      # git status for the same reason as in the collect job: files new to the
      # repository are invisible to git diff.
      - name: Check for changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git status --porcelain --untracked-files=all
          fi

      - name: Set date
        id: date
        run: |
          echo "today=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "branch=automated/related-references-$(date +'%Y-%m-%d')-${{ github.run_id }}" >> $GITHUB_OUTPUT

      - name: Create pull request with new references
        if: steps.changes.outputs.changed == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated related references update ${{ steps.date.outputs.today }}"
          branch: ${{ steps.date.outputs.branch }}
          delete-branch: true
          title: "New related references ${{ steps.date.outputs.today }}"
          body: |
            Automated collection of related references from Scopus & CrossRef.
          labels: automated, references

      - name: Auto-merge pull request
        if: steps.create-pr.outputs.pull-request-number != ''
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" \
            --squash \
            --subject "Automated related references update ${{ steps.date.outputs.today }}" \
            --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
