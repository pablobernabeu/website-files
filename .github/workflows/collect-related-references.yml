name: Collect Related References

on:
  schedule:
    # Run weekly on Mondays at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch: # Allow manual triggering

jobs:
  collect-references:
    runs-on: ubuntu-latest

    env:
      SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pdfplumber
        run: pip install pdfplumber

      - name: Auto-generate query scripts from PDFs
        run: python scripts/extract_refs_from_pdfs.py

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R packages
        run: |
          install.packages(c("yaml", "rscopus", "rcrossref", "dplyr", "httr", "jsonlite"), repos = "https://cloud.r-project.org")
        shell: Rscript {0}

      - name: Run related references collection
        run: |
          Rscript scripts/collect_related_references.R

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Create pull request with new references
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Automated related references update $(date +'%Y-%m-%d')"
          branch: automated/related-references
          delete-branch: true
          title: "New related references $(date +'%Y-%m-%d')"
          body: |
            Automated daily collection of related references from Scopus.

            **Changed files:**
            $(git diff --name-only)

            Review the new citations, then merge to trigger deployment.
          labels: automated, references
