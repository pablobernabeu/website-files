name: Alt-text check

# Advisory accessibility check: lists content images that lack alt text, as
# inline annotations on the commit/PR. The job does NOT fail by default, so the
# existing backlog stays non-blocking. To enforce on new content once the
# backlog is cleared, uncomment ALT_CHECK_STRICT below (it fails only on
# hand-authored content images missing alt, not on generated figures).

on:
  push:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
      - "content/**/*.html"
      - ".github/scripts/check_alt_text.py"
      - ".github/workflows/alt-text-check.yml"
  # The generated reference lists are excluded here but not from the push trigger
  # above, so their content is still checked once it lands on master. The
  # collect-related-references workflow opens its pull requests with
  # GITHUB_TOKEN, and GitHub does not run workflows on those without manual
  # approval, so each one left a run parked at "action required" for ever: on a
  # check that is advisory, over files it sees on the merge commit anyway, for a
  # pull request that same workflow auto-merges seconds later. A permanently
  # pending signal is worse than none, because it is where a real approval
  # request would go unnoticed.
  pull_request:
    paths:
      - "content/**/*.md"
      - "content/**/*.Rmd"
      - "content/**/*.html"
      - "!content/**/related-references.html"
  workflow_dispatch:

jobs:
  alt-text:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect images missing alt text
        run: python3 .github/scripts/check_alt_text.py
        # env:
        #   ALT_CHECK_STRICT: "1"   # uncomment to fail the job on missing alt
