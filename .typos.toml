# Typos configuration for academic Hugo site
# https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
# Skip generated/data files
extend-exclude = [
  "public/",
  "themes/",
  "renv/",
  "static/rmarkdown-libs/",
  # Generated blog assets (HTML widgets, JS libs, sourcemaps)
  "content/**/index_files/**",
  "content/**/index.en_files/**",
  "content/**/index.*_files/**",
  "**/*.map",
  "*.bib",
  "*.csv",
  "*.json",
  "*.js",
  "*.css",
  "*.R",
  "*.html",
]

[default]
# Don't check filenames (folder names contain slugs, not prose)
check-filename = false

[default.extend-identifiers]
# Technical terms and abbreviations common in academic writing
# (identifier = correct spelling to suppress false positives)
# Matched BEFORE camelCase splitting -- use this for mixed-case tokens.
LangUE = "LangUE"         # else splits to "Lang" + "UE" and "UE" gets flagged

[default.extend-words]
# Words that typos flags but are correct in academic context
ith = "ith"             # "i-th" element
nto = "nto"             # e.g., "into" split across lines
ot = "ot"               # abbreviation in some contexts
te = "te"               # Dutch word / abbreviation
fo = "fo"               # abbreviation
als = "als"             # Dutch/German word
vor = "vor"             # German word
ist = "ist"             # German/Dutch word
auf = "auf"             # German word
ser = "ser"             # Spanish word
hoc = "hoc"             # as in "ad hoc" or "post hoc"
ful = "ful"             # suffix
ned = "ned"             # past tense
thr = "thr"             # abbreviation
caf = "caf"             # abbreviation
lme = "lme"             # lme4 R package
lmer = "lmer"           # lme4 function
brms = "brms"           # R package
simr = "simr"           # R package
rstats = "rstats"       # hashtag
rmarkdown = "rmarkdown" # R package
blogdown = "blogdown"   # R package
knitr = "knitr"         # R package
tibble = "tibble"       # R package
dplyr = "dplyr"         # R package
ggplot = "ggplot"       # R package
sjplot = "sjplot"       # R package
opensesame = "opensesame" # software
psycholinguistics = "psycholinguistics"
crosslinguistic = "crosslinguistic"
psychophysics = "psychophysics"
neuroinformatics = "neuroinformatics"
morphosyntax = "morphosyntax"
morphosyntactic = "morphosyntactic"
multimodal = "multimodal"
sensorimotor = "sensorimotor"
nonwords = "nonwords"
preregistration = "preregistration"
preregistered = "preregistered"
Packt = "Packt"           # Packt Publishing (proper noun)
# Author surnames flagged as misspellings
Mata = "Mata"
Hald = "Hald"
Hendler = "Hendler"
Paret = "Paret"
Tham = "Tham"
Uner = "Uner"
Hassel = "Hassel"
Blok = "Blok"
Bui = "Bui"
Sclar = "Sclar"
Raison = "Raison"
# Technical terms and foreign-language words
formant = "formant"       # phonetics term
conceptos = "conceptos"   # Spanish word in Spanish titles
extraversion = "extraversion"  # personality psychology term
# Acronyms / stylisations
ND = "ND"                 # as in CC BY-NC-ND
BA = "BA"                 # Bachelor of Arts degree (e.g. "BA English")
# (LangUE moved to [default.extend-identifiers] above to avoid a "UE" split)
# Additional author surnames flagged as misspellings
Perfors = "Perfors"       # Amy Perfors
Smeesters = "Smeesters"   # Dirk Smeesters
Frane = "Frane"           # Andrew V. Frane
Vally = "Vally"           # D. Z. Vally
# Academic terms and British-English variants
nonsignificant = "nonsignificant"  # standard stats term (non-significant)
focusses = "focusses"     # British-English variant of "focuses"
# Foreign-language words (correct within Spanish/Norwegian passages)
profesor = "profesor"     # Spanish "professor"
accesible = "accesible"   # Spanish "accessible"
som = "som"               # Norwegian "as/that"
noen = "noen"             # Norwegian "some"
registrer = "registrer"   # Norwegian "register"
# Markup artifact
ccessible = "ccessible"   # from "<b>A</b>ccessible" (FAIR) splitting on the tag
