# The works cited in index.en.Rmd, in CSL YAML, which pandoc's citeproc reads
# with csl/apa.csl at the root of the repository (csl/README.md explains the
# set-up). Titles are in sentence case, as CSL expects, and the style prints
# them as written, so a title such as 'depictr: ...' keeps its lower case.
# Author lists are complete, since APA 7 lists up to 20 authors and, from 21,
# the first 19 and the last. Quotation marks inside a title are written as the
# characters themselves, since citeproc would turn straight ones into double
# quotes. Proceedings without listed editors are entered as chapters, so that
# APA's 'In' precedes them.
