<aside class="search-results" id="search">
  {{/* The dialog role goes on the inner container, because <aside> may not take it. */}}
  <div class="container" role="dialog" aria-modal="true" aria-label="{{ i18n "search" }}">
    <section class="search-header">

      <div class="row no-gutters justify-content-between mb-3">
        <div class="col-6">
          <h2>{{ i18n "search" }}</h2>
        </div>
        <div class="col-6 col-search-close">
          <a class="js-search" href="#" role="button" aria-label="Close search"><i class="fas fa-times-circle text-muted" aria-hidden="true"></i></a>
        </div>
      </div>

      <div id="search-box">
        {{ if eq site.Params.search.engine 1 }}
        <input name="q" id="search-query" aria-label="{{ i18n "search" }}" placeholder="{{i18n "search_placeholder"}}" autocapitalize="off"
        autocomplete="off" autocorrect="off" spellcheck="false" type="search">
        {{ else }}
        <!-- Search box will appear here -->
        {{ end }}
      </div>

    </section>
    <section class="section-search-results">

      <div id="search-hits">
        <!-- Search results will appear here -->
      </div>

    </section>
  </div>
</aside>
