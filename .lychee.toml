# Lychee link checker configuration
# https://lychee.cli.rs/configuration/

# Exclude patterns — URLs that commonly return false positives
exclude = [
  # LinkedIn blocks automated requests
  "linkedin\\.com",
  # localhost / example URLs
  "localhost",
  "127\\.0\\.0\\.1",
  "example\\.com",
  # Shiny apps may be sleeping (503 on first hit)
  "shinyapps\\.io",
  # Twitter/X rate-limits aggressively. Anchored, as a bare "x\\.com" also
  # matched any host ending in x.com, such as ivoox.com and mapbox.com.
  "twitter\\.com",
  "^https?://(www\\.)?x\\.com",
  # Mail links
  "^mailto:",
  # Apple podcast embeds (require auth)
  "embed\\.podcasts\\.apple\\.com"
]

# Accept these status codes as valid (some DOI resolvers return 403 to bots).
# Listing codes replaces lychee's default of any 2xx, so the range is kept.
# Redirects are followed, so 301 and 302 never reach this check.
accept = ["200..=299", 403, 429]

# Include only these file types
include_mail = false

# Maximum concurrent requests
max_concurrency = 8
